quarkus.application.name=order-service
quarkus.http.host=0.0.0.0
greeting.prefix=${GREETING_PREFIX:Hello}
quarkus.smallrye-openapi.info-title=order-service REST API
quarkus.smallrye-openapi.info-version=1.0.0
# Jib pushes directly to the registry. Build/push are opt-in at build time.
quarkus.container-image.builder=jib
quarkus.jib.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-21-runtime@sha256:856ee6542b8fdf09a065fd5439309fc3f3c821fb8efac48aa6191c93635dd907
quarkus.jib.platforms=linux/amd64
quarkus.jib.use-current-timestamp=false

# The catalog reads the deployed contract; Swagger uses the public HTTPS Route.
%prod.quarkus.smallrye-openapi.servers=${PUBLIC_API_URL:https://order-service-dev.apps.ocp.box1.org}
quarkus.swagger-ui.always-include=true
# Allow Developer Hub's API Definition tester to call this service directly.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://developer-hub.apps.ocp.box1.org
quarkus.http.cors.methods=GET,HEAD,OPTIONS,POST,PUT,PATCH,DELETE
quarkus.http.cors.headers=Accept,Authorization,Content-Type,Idempotency-Key,X-Consumer-Id,X-Correlation-Id,traceparent
quarkus.http.cors.access-control-allow-credentials=false

# A valid order is far smaller, and the API has no authentication yet.
quarkus.http.limits.max-body-size=16K
# The contract sets additionalProperties: false on the create request.
quarkus.jackson.fail-on-unknown-properties=true

# PostgreSQL. The JDBC URL, username and password come from the environment at runtime.
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.datasource.jdbc.max-size=10
# Keeps row values out of driver messages.
quarkus.datasource.jdbc.additional-jdbc-properties.logServerErrorDetail=false
# Readiness uses DatabaseReadinessCheck, which the no-database test profile can switch off at runtime.
quarkus.datasource.health.enabled=false
order.readiness.database=true

# Kafka. The bootstrap address comes from KAFKA_BOOTSTRAP_SERVERS at runtime.
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
quarkus.kafka.devservices.enabled=false

mp.messaging.incoming.inventory-events.connector=smallrye-kafka
mp.messaging.incoming.inventory-events.topic=box1.inventory.events.v1
mp.messaging.incoming.fulfillment-events.connector=smallrye-kafka
mp.messaging.incoming.fulfillment-events.topic=box1.fulfillment.events.v1
# Channel settings are per channel because the connector has no shared incoming block.
mp.messaging.incoming.inventory-events.group.id=order
mp.messaging.incoming.fulfillment-events.group.id=order
mp.messaging.incoming.inventory-events.auto.offset.reset=earliest
mp.messaging.incoming.fulfillment-events.auto.offset.reset=earliest
mp.messaging.incoming.inventory-events.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.fulfillment-events.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.inventory-events.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.fulfillment-events.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.inventory-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.fulfillment-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.inventory-events.dead-letter-queue.topic=${order.dlq.topic}
mp.messaging.incoming.fulfillment-events.dead-letter-queue.topic=${order.dlq.topic}
# A database outage holds records in retries, which must not trip the 60 s default and restart the pod.
mp.messaging.incoming.inventory-events.throttled.unprocessed-record-max-age.ms=-1
mp.messaging.incoming.fulfillment-events.throttled.unprocessed-record-max-age.ms=-1
# Kafka is deliberately not a readiness dependency; see the runbook.
mp.messaging.incoming.inventory-events.health-readiness-enabled=false
mp.messaging.incoming.fulfillment-events.health-readiness-enabled=false
mp.messaging.incoming.inventory-events.tracing-enabled=false
mp.messaging.incoming.fulfillment-events.tracing-enabled=false

# Order behavior
order.completion.policy=${ORDER_COMPLETION_POLICY:none}
order.dlq.topic=box1.order.dlq.v1
order.outbox.topic=box1.order.events.v1
order.outbox.poll-interval=${ORDER_OUTBOX_POLL_INTERVAL:1s}
order.outbox.batch-size=${ORDER_OUTBOX_BATCH_SIZE:100}
order.outbox.lease-seconds=${ORDER_OUTBOX_LEASE_SECONDS:60}
order.outbox.backoff-base-seconds=${ORDER_OUTBOX_BACKOFF_BASE_SECONDS:1}
order.outbox.backoff-max-seconds=${ORDER_OUTBOX_BACKOFF_MAX_SECONDS:300}
order.consumer.max-attempts=${ORDER_CONSUMER_MAX_ATTEMPTS:20}
order.consumer.initial-backoff-millis=${ORDER_CONSUMER_INITIAL_BACKOFF_MILLIS:500}
order.consumer.max-backoff-millis=${ORDER_CONSUMER_MAX_BACKOFF_MILLIS:30000}
order.stuck-after-seconds=${ORDER_STUCK_AFTER_SECONDS:900}
order.metrics.refresh-interval=${ORDER_METRICS_REFRESH_INTERVAL:15s}

# Traces propagate through W3C headers. Export stays off until a collector exists (box1-docs#22).
quarkus.otel.traces.exporter=none
quarkus.otel.metrics.exporter=none
quarkus.otel.logs.exporter=none

# Structured JSON logs in the deployed image; MDC carries orderId, eventId and trace IDs.
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# The default test run has no database or broker, because the CI task has no container runtime.
# Tests tagged "containers" supply both; run them with -Pcontainers.
quarkus.test.integration-test-profile=test
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.jdbc.url=${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/service}
%test.quarkus.datasource.username=${TEST_DATABASE_USERNAME:postgres}
%test.quarkus.datasource.password=${TEST_DATABASE_PASSWORD:postgres}
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.scheduler.enabled=false
%test.order.readiness.database=false

---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  labels:
    backstage.io/kubernetes-id: order-service
  generateName: "order-service-release-"
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/target-namespace: box1-ci
    pipelinesascode.tekton.dev/max-keep-runs: '10'
spec:
  taskRunTemplate:
    serviceAccountName: ci-build
  timeouts:
    pipeline: 45m
  params:
  - name: revision
    value: "{{revision}}"
  - name: git-auth-secret
    value: "{{git_auth_secret}}"
  - name: security-gates
    value: gate
  pipelineSpec:
    params:
    - name: revision
      type: string
    - name: git-auth-secret
      type: string
    - name: security-gates
      type: string
      default: disabled
    tasks:
    - name: build
      taskRef:
        resolver: cluster
        params:
        - name: kind
          value: task
        - name: name
          value: box1-quarkus-maven
        - name: namespace
          value: box1-ci
      params:
      - name: revision
        value: "$(params.revision)"
      - name: git-auth-secret
        value: "$(params.git-auth-secret)"
      - name: push-image
        value: 'true'
      - name: source-repo
        value: box1-org/order-service
      - name: image-name
        value: "order-service"
    - name: security
      runAfter:
      - build
      taskRef:
        resolver: cluster
        params:
        - name: kind
          value: task
        - name: name
          value: box1-security-gates
        - name: namespace
          value: box1-ci
      params:
      - name: image-reference
        value: "image-registry.openshift-image-registry.svc:5000/box1-ci/order-service@$(tasks.build.results.image-digest)"
      - name: image-digest
        value: "$(tasks.build.results.image-digest)"
      - name: source-revision
        value: "$(params.revision)"
      - name: source-repository
        value: "box1-org/order-service"
      - name: application-name
        value: "order-service"
      - name: pipeline-run
        value: "$(context.pipelineRun.name)"
      - name: enforcement
        value: "$(params.security-gates)"
      - name: rhtpa-secret
        value: rhtpa-ci
      - name: rhacs-secret
        value: rhacs-ci
    - name: promote
      runAfter:
      - security
      taskRef:
        resolver: cluster
        params:
        - name: kind
          value: task
        - name: name
          value: box1-gitops-promote
        - name: namespace
          value: box1-ci
      params:
      - name: revision
        value: "$(params.revision)"
      - name: image-digest
        value: "$(tasks.build.results.image-digest)"
      - name: git-auth-secret
        value: "$(params.git-auth-secret)"
      - name: environment
        value: development
      - name: pipeline-run
        value: "$(context.pipelineRun.name)"
      - name: application-name
        value: "order-service"
    - name: smoke
      runAfter:
      - promote
      when:
      - input: "$(tasks.promote.results.promoted)"
        operator: in
        values:
        - 'true'
      taskRef:
        resolver: cluster
        params:
        - name: kind
          value: task
        - name: name
          value: box1-quarkus-smoke
        - name: namespace
          value: box1-ci
      params:
      - name: revision
        value: "$(params.revision)"
      - name: image-digest
        value: "$(tasks.build.results.image-digest)"
      - name: application-name
        value: "order-service"
      - name: application-namespace
        value: "order-service-dev"
    # The shared smoke task knows nothing about orders. These checks write nothing:
    # both POSTs are rejected before persistence, so a broken create still would not show here.
    - name: order-api-smoke
      runAfter:
      - smoke
      taskSpec:
        steps:
        - name: order-api
          image: registry.access.redhat.com/ubi9/python-311@sha256:d0b35f779ca0ae87deaf17cd1923461904f52d3ef249a53dbd487e02bdabdde6
          script: |
            #!/usr/bin/env python3
            import json, urllib.error, urllib.request
            base = 'https://order-service-dev.apps.ocp.box1.org'
            order = {'customerId': 'cust_smoke', 'sku': 'SKU-SMOKE', 'quantity': 1, 'siteId': 'site_smoke'}
            def call(path, data=None, headers=None):
                request = urllib.request.Request(base + path, data=data, headers=headers or {})
                try:
                    with urllib.request.urlopen(request, timeout=20) as response:
                        return response.status, response.headers.get('Content-Type', ''), response.read().decode()
                except urllib.error.HTTPError as error:
                    return error.code, error.headers.get('Content-Type', ''), error.read().decode()
            def problem(result, status):
                assert result[0] == status and 'application/problem+json' in result[1], result
            status, _, body = call('/api/v1/orders?limit=1')
            assert status == 200 and isinstance(json.loads(body), list), body
            problem(call('/api/v1/orders/ord_smoke_missing'), 404)
            json_body = {'Content-Type': 'application/json'}
            problem(call('/api/v1/orders', json.dumps(order).encode(), json_body), 400)
            bad = dict(json_body, **{'Idempotency-Key': 'smoke-invalid'})
            problem(call('/api/v1/orders', json.dumps({'customerId': 'x'}).encode(), bad), 400)
            api = json.loads(call('/q/openapi?format=json')[2])
            responses = api['paths']['/api/v1/orders']['post']['responses']
            assert {'200', '201', '400', '409'} == set(responses), sorted(responses)
            print('PASS: order reads, 404 and 400 problems, served OpenAPI responses. No order was written.')
    results:
    - name: image-digest
      value: "$(tasks.build.results.image-digest)"
    - name: gitops-pr
      value: "$(tasks.promote.results.pr-url)"
    - name: gitops-revision
      value: "$(tasks.promote.results.gitops-revision)"
  taskRunSpecs:
  - pipelineTaskName: promote
    serviceAccountName: ci-gitops
  - pipelineTaskName: smoke
    serviceAccountName: ci-observe
  - pipelineTaskName: order-api-smoke
    serviceAccountName: ci-test

apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: order-service
  description: "Transactional state of customer requested orders"
  annotations:
    github.com/project-slug: box1-org/order-service
    backstage.io/kubernetes-id: order-service
    backstage.io/techdocs-ref: dir:.
    backstage.io/source-location: url:https://github.com/box1-org/order-service/
    janus-idp.io/tekton: order-service
    argocd/instance-name: openshift-gitops
    argocd/app-selector: backstage.io/kubernetes-id=order-service
    box1.org/template-version: "1.1.0"
  tags: [java, quarkus, maven, tekton, gitops]
  links:
    - url: https://order-service-dev.apps.ocp.box1.org/q/swagger-ui/
      title: Swagger UI — test endpoints
      icon: code
    - url: https://order-service-dev.apps.ocp.box1.org/q/openapi
      title: OpenAPI specification
      icon: code
    - url: https://order-service-dev.apps.ocp.box1.org
      title: Application Route (after first release)
    - url: https://github.com/box1-org/box1-workloads-dev/tree/main/workloads/order-service
      title: Desired deployment configuration
    - url: https://devspaces.apps.ocp.box1.org/#https://github.com/box1-org/order-service
      title: Open in Dev Spaces
      icon: code
    # Add actual service-specific observability URLs
    # when dashboards and log views exist.
spec:
  type: service
  lifecycle: experimental
  owner: "user:default/mike4263"
  # Add when the corresponding System entity exists:
  # system: box1-demo
  providesApis:
    - order-service-api
    - box1-order-events
  consumesApis:
    - box1-inventory-events
    - box1-fulfillment-events
  dependsOn:
    - resource:order-service-postgres
    - resource:box1-kafka
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: order-service-api
  description: OpenAPI contract for order-service
  tags: [quarkus, openapi]
spec:
  type: openapi
  lifecycle: experimental
  owner: "user:default/mike4263"
  definition:
    $text: https://order-service-dev.apps.ocp.box1.org/q/openapi
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: box1-order-events
  title: box1.order.events.v1
  description: Kafka topic box1.order.events.v1, produced by order-service through its transactional outbox. Contracts are owned by box1-ops-contracts.
  tags: [kafka, events, asyncapi]
  links:
    - url: https://github.com/box1-org/box1-ops-contracts/blob/main/TOPICS.md
      title: Topic ownership and consumer groups
      icon: docs
spec:
  type: asyncapi
  lifecycle: experimental
  owner: "user:default/mike4263"
  definition: |
    asyncapi: 2.6.0
    info:
      title: box1.order.events.v1
      version: v1
      description: >-
        Delivery is at least once; consumers record eventId transactionally.
        Partition key orderId. Retention 7d.
    servers:
      dev:
        url: box1-kafka-kafka-bootstrap.box1-kafka.svc:9092
        protocol: kafka
    channels:
      box1.order.events.v1:
        publish:
          summary: Events published by order-service
          message:
            oneOf:
            - name: order.placed.v1
              title: order.placed.v1
              summary: v1 envelope carrying order.placed (see https://github.com/box1-org/box1-ops-contracts/blob/main/events/v1/order.placed.schema.json)
              contentType: application/json
            - name: order.state-changed.v1
              title: order.state-changed.v1
              summary: v1 envelope carrying order.state-changed (see https://github.com/box1-org/box1-ops-contracts/blob/main/events/v1/order.state-changed.schema.json)
              contentType: application/json
            - name: fulfillment.requested.v1
              title: fulfillment.requested.v1
              summary: v1 envelope carrying fulfillment.requested (see https://github.com/box1-org/box1-ops-contracts/blob/main/events/v1/fulfillment.requested.schema.json)
              contentType: application/json
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: order-service-postgres
  description: PostgreSQL database order_service owned by order-service (order-service-dev namespace)
  tags: [postgresql, database]
  links:
    - url: https://github.com/box1-org/box1-workloads-dev/blob/main/workloads/order-service/postgres.yaml
      title: Database manifest
spec:
  type: database
  lifecycle: experimental
  owner: "user:default/mike4263"
